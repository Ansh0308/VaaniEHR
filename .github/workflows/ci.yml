name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check (lint, typecheck, tests, guards, pytest)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['20', '24']
    # Real PostgreSQL for the database tests (append-only grants, hash chain, RBAC end to end). Throwaway values only.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: vaani
          POSTGRES_PASSWORD: ci-throwaway-owner-password
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vaani"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://vaani:ci-throwaway-owner-password@localhost:5433/postgres
      APP_DB_PASSWORD: ci-throwaway-app-password-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/asr-py/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r apps/asr-py/requirements-dev.txt
      - run: npm run check
      - run: npm run build
      - name: api-node coverage report (core modules must meet their thresholds)
        if: matrix.node == '24'
        run: npm run coverage:api

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Official gitleaks CLI, pinned to an exact release and verified against its published SHA-256
      # (no third-party action). Scans every commit; findings are printed redacted. Same command works locally.
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan all commits
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact --no-banner -v'

  no-shell-scripts:
    name: fail on .sh/.bat files outside .github/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-no-shell-scripts.mjs

  no-data-files:
    name: repo guards (no data/audio files; seed/ rows carry a source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-no-data-files.mjs
      - run: node --test scripts/seed-sources.test.mjs
      - run: node scripts/check-seed-sources.mjs

  a11y:
    name: browser accessibility (axe, 44px targets, reduced motion; en + gu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # uses the Chrome that is preinstalled on the runner; no browser download
      - run: npm run a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome

  e2e:
    name: end-to-end (real API, Postgres and browser; fake data only)
    runs-on: ubuntu-24.04
    # Real PostgreSQL. Throwaway values only; nothing here is a real secret.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: vaani
          POSTGRES_PASSWORD: ci-throwaway-owner-password
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vaani"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://vaani:ci-throwaway-owner-password@localhost:5433/postgres
      APP_DB_PASSWORD: ci-throwaway-app-password-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # the speech service (mock engine) runs in this job too
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r apps/asr-py/requirements.txt
      # the run creates, migrates and seeds its own throwaway database (random fake logins in a temp file) and drops it
      # uses the Chrome that is preinstalled on the runner; no browser download
      - run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

  docker-build:
    name: docker build ${{ matrix.image }} (no push)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [api-node, web, asr-py]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/${{ matrix.image }}/Dockerfile -t vaaniehr/${{ matrix.image }}:ci .

  compose-config:
    name: docker compose config is valid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/setup-env.mjs
      - run: docker compose --env-file infra/.env -f infra/docker-compose.yml config --quiet

  sbom:
    name: generate SBOM (artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r apps/asr-py/requirements-dev.txt
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: docs/SBOM.md
