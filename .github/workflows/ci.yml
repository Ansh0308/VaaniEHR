name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check (lint, typecheck, tests, guards, pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/asr-py/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r apps/asr-py/requirements-dev.txt
      - run: npm run check
      - run: npm run build

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-shell-scripts:
    name: fail on .sh/.bat files outside .github/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-no-shell-scripts.mjs

  no-data-files:
    name: fail if data/audio files are tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-no-data-files.mjs

  docker-build:
    name: docker build ${{ matrix.image }} (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api-node, web, asr-py]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/${{ matrix.image }}/Dockerfile -t vaaniehr/${{ matrix.image }}:ci .

  compose-config:
    name: docker compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/setup-env.mjs
      - run: docker compose --env-file infra/.env -f infra/docker-compose.yml config --quiet

  sbom:
    name: generate SBOM (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r apps/asr-py/requirements-dev.txt
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: docs/SBOM.md
