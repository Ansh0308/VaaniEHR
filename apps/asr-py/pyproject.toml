[project]
name = "vaaniehr-asr-py"
version = "0.1.0"
description = "VaaniEHR ASR / extraction service (Phase 1.1: /health only)"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# the formatter keeps code within 100 columns; long docstrings and comments are fine
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
