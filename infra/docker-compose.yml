# VaaniEHR local stack: db, asr-py, api-node, web.
#   npm run stack:up     build images, start everything, wait until healthy, apply migrations
#   npm run stack:down   stop and remove the containers (the database volume is kept)
# Needs infra/.env and the apps' .env files: run `npm run setup:env` once. Docker Desktop must be running.
# Secrets come from git-ignored env files at RUN time; nothing secret is copied into any image (see .dockerignore).
# All ports are bound to 127.0.0.1 only.
name: vaaniehr

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  db:
    # PostgreSQL 16 + pgvector 0.8.7 (Debian bookworm), pinned by tag AND digest (checked on Docker Hub 2026-10-14).
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaani}
      POSTGRES_DB: ${POSTGRES_DB:-vaaniehr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (run npm run setup:env)}
    ports:
      # 5433 avoids clashing with a native PostgreSQL on 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - vaaniehr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  asr-py:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/asr-py/Dockerfile
    image: vaaniehr/asr-py:local
    env_file:
      - ../apps/asr-py/.env
    read_only: true
    ports:
      - '127.0.0.1:${ASR_PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  api-node:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/api-node/Dockerfile
    image: vaaniehr/api-node:local
    env_file:
      - ../apps/api-node/.env
    environment:
      # Inside the compose network the database is reachable as "db:5432"; these override the host-oriented .env values.
      NODE_ENV: development
      PORT: '4000'
      DATABASE_URL: postgres://vaani_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required (run npm run setup:env)}@db:5432/${POSTGRES_DB:-vaaniehr}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
    read_only: true
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  web:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Public build-time values only (they are compiled into the JS bundle). Never put secrets here.
        VITE_API_BASE_URL: http://localhost:${API_PORT:-4000}
        VITE_SIMULATED_DATA_ONLY: 'true'
    image: vaaniehr/web:local
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:8080'
    depends_on:
      api-node:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  vaaniehr_pgdata:
